# Continuous Integration
#
# Triggers: On pushes to main/master and pull requests
#
#   What it does:
#   - Runs tests
#   - Checks code formatting (cargo fmt)
#   - Runs linter (cargo clippy)
#   - Builds on Ubuntu, Windows, and macOS

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (job_config)
        run: cargo test -p job_config --verbose

      - name: Run tests (silva)
        run: cargo test -p silva --verbose -- --test-threads=1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  workflow-e2e:
    name: Workflow E2E
    runs-on: ubuntu-latest
    steps:
      # test_workflows.sh runs `silva run ../collab-workflows/workflows/workflow-007`,
      # so the two checkouts must be siblings and the script must run from inside
      # this one. Note this repo also contains a `silva/` crate directory, so the
      # path below yields silva/silva/... -- the `cd silva` target is the outer one.
      - name: Checkout silva
        uses: actions/checkout@v4
        with:
          path: silva

      # Tracked at the default branch on purpose: silva is verified against the
      # workflows users actually run, rather than a pinned snapshot that drifts.
      # The trade-off is real -- a commit in that repo can turn this red with
      # nobody having touched silva.
      - name: Checkout collab-workflows
        uses: actions/checkout@v4
        with:
          repository: chiral-data/collab-workflows
          path: collab-workflows

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('silva/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: silva/target
          key: ${{ runner.os }}-cargo-e2e-target-${{ hashFiles('silva/Cargo.lock') }}

      # Runs workflow-007 headlessly: three nodes, all on
      # ghcr.io/chiral-data/pocketeer (public, ~1.26 GB, pulled once). silva exits
      # non-zero when a job fails, so this is a real gate.
      #
      # 01-download fetches from files.rcsb.org, so an outage there can fail this
      # job with no silva change. If that becomes a problem the answer is a retry
      # or a lighter fixture -- not `continue-on-error`, which is what this same
      # commit removes from the test job above.
      - name: Run a real workflow end to end
        run: cd silva && ./test_workflows.sh

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose --workspace
